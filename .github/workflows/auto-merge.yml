# claude/ 브랜치 PR 자동 병합: 사람의 병합 클릭을 검사 게이트로 바꾼다.
# Notion_Sync 저장소의 auto-merge 워크플로(AUTOMATION_3.0)를 이 저장소에 맞게 옮겼다.
#
# 동작
#   - 게이트(단위 테스트 + 샘플 재생성 일치) 통과 → 드래프트 해제 → 병합 커밋으로 병합 → Pages 배포 실행
#   - 검사 실패 → 잡이 빨갛게 남는다. PR 을 만든 세션이 CI 실패 이벤트로 고친다
#   - `hold` 라벨이 붙어 있으면 아무것도 하지 않는다
#   - 이미 병합·닫힌 PR 은 아무것도 하지 않는다 (병합이 ready_for_review 로 한 번 더 깨우기 때문)
#   - .github/workflows/ 를 고치는 PR 은 이 워크플로의 토큰으로 병합할 수 없다(workflows 권한 없음).
#     댓글만 남기고, PR 을 만든 세션이 병합한다
#
# 범위: 같은 저장소의 claude/ 브랜치 PR 만. 포크·다른 브랜치는 건드리지 않는다.

name: 자동 병합

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    if: >-
      startsWith(github.head_ref, 'claude/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      HOLD: ${{ contains(github.event.pull_request.labels.*.name, 'hold') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: PR 상태 확인
        id: state
        run: |
          state=$(gh pr view "$PR" --json state --jq .state)
          echo "state=$state" >> "$GITHUB_OUTPUT"
          [ "$state" = "OPEN" ] || echo "PR 이 $state 상태입니다. 아무것도 하지 않습니다."

      - name: hold 라벨 준비
        if: steps.state.outputs.state == 'OPEN'
        run: gh label create hold --color D93F0B --description "자동 병합 보류" --force

      - name: 단위 테스트
        if: steps.state.outputs.state == 'OPEN'
        run: node --test tests/*.test.js

      - name: 샘플 데이터가 생성기 결과와 같은지 확인
        if: steps.state.outputs.state == 'OPEN'
        run: |
          node scripts/make-sample.js
          git diff --exit-code -- sample js/sample-data.js

      - name: 워크플로 변경 여부
        id: wf
        if: steps.state.outputs.state == 'OPEN'
        run: |
          base=$(gh pr view "$PR" --json baseRefName --jq .baseRefName)
          if git diff --name-only "origin/$base...HEAD" | grep -q '^\.github/workflows/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 워크플로 변경 PR 안내
        if: steps.state.outputs.state == 'OPEN' && steps.wf.outputs.changed == 'true'
        run: |
          marker='<!-- auto-merge:workflow-change -->'
          if ! gh pr view "$PR" --json comments --jq '.comments[].body' | grep -q "$marker"; then
            gh pr comment "$PR" --body "$(printf '%s\n%s\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_' \
              "$marker" '자동 병합 제외: 워크플로 파일을 고치는 PR 이라 이 워크플로의 토큰으로는 병합할 수 없습니다. 검사는 통과했으니 PR 을 만든 세션이 병합합니다.')"
          fi

      - name: hold 라벨이면 대기
        if: steps.state.outputs.state == 'OPEN' && env.HOLD == 'true'
        run: echo "hold 라벨이 있어 병합하지 않습니다."

      - name: 병합
        if: steps.state.outputs.state == 'OPEN' && steps.wf.outputs.changed == 'false' && env.HOLD != 'true'
        run: |
          if [ "$(gh pr view "$PR" --json isDraft --jq .isDraft)" = "true" ]; then
            gh pr ready "$PR"
          fi
          gh pr merge "$PR" --merge

      # 이 워크플로의 토큰으로 병합한 push 는 다른 워크플로를 깨우지 않는다. 배포는 직접 띄운다
      - name: Pages 배포 실행
        if: steps.state.outputs.state == 'OPEN' && steps.wf.outputs.changed == 'false' && env.HOLD != 'true'
        run: gh workflow run pages.yml --ref main || echo "::warning::Pages 배포를 시작하지 못했습니다. Settings → Pages 설정을 확인하세요."
